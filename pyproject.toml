[project]
name = "vks"
version = "1.0.0"
description = "Grounding natural-language car search in a vehicle knowledge graph: LLM, vector RAG, graph retrieval and a validating agent, ground truth from sessions, drift and hallucination monitoring"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF046", "E731", "SIM102", "SIM105", "SIM108", "B007", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_world.py" = ["E501"]
"scripts/report.py" = ["E501"]
